services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netsentry
      POSTGRES_USER: netsentry
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentry -d netsentry"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NETSENTRY_DATABASE_URL: postgresql+psycopg://netsentry:local-demo-only@db:5432/netsentry
      NETSENTRY_SAMPLES_PATH: /app/samples
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  pgdata:
